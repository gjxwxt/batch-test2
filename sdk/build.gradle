plugins {
    id 'java-library'
}

group = 'com.example'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

repositories {
    mavenCentral()
}

dependencies {
    // Minimal runtime deps: use JDK built-ins (java.net.http, java.security) so the
    // SDK stays a lightweight embeddable JAR with no Spring/Web framework coupling.
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

// Produce a plain embeddable JAR (not a fat/executable jar). Consumers embed this
// artifact as a library dependency.
jar {
    archiveBaseName = 'ias-auth-sdk'
    archiveVersion = version
    manifest {
        attributes(
            'Implementation-Title': 'IAS Auth Center Client SDK',
            'Implementation-Version': version,
            'Automatic-Module-Name': 'com.example.sdk'
        )
    }
}