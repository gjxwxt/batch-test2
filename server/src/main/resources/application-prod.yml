# 生产 profile（application-prod.yml）：连接真实 PostgreSQL 12+ 多节点共享库。
#
# 启用方式：SPRING_PROFILES_ACTIVE=prod（或 --spring.profiles.active=prod）。
# 数据源参数通过环境变量注入（DB_URL / DB_USERNAME / DB_PASSWORD），
# 满足 req-28 多节点配额强一致（O7：多节点共享同一库，原子 SQL/CAS 配额）。
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ias_auth}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:ias_auth}
    password: ${DB_PASSWORD:ias_auth}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: none