server:
  port: 8080

spring:
  application:
    name: spring-boot-starter-app
  # 数据源配置（infra:scaffold：MyBatis-Plus + PostgreSQL + Flyway）。
  #
  # 默认 profile 使用 H2（PostgreSQL 兼容模式）作为内嵌数据源，保证服务端开箱即启动
  # （验收 AUTH-004：GET /api/v1/health 返回 UP），并让 Flyway 迁移与原子 SQL/CAS
  # 配额（req-28）在本地无 PostgreSQL 环境下可运行。
  #
  # 生产部署请使用 prod profile（application-prod.yml），连接真实 PostgreSQL 12+
  # 多节点共享库，实现配额强一致（req-28 / O7）。数据源参数均可通过环境变量注入：
  #   DB_URL / DB_USERNAME / DB_PASSWORD / DB_DRIVER
  datasource:
    url: ${DB_URL:jdbc:h2:mem:ias_auth;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: none

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.example.app: DEBUG
